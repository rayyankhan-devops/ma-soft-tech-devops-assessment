services:
  # ------------------------------------------------------------------
  # Database Service (MySQL 8.0)
  # ------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: ma-devops-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: devops_password
      MYSQL_DATABASE: ma_devops_db
    ports:
      - "3306:3306"
    volumes:
      # Auto-initialization: executes 01_schema.sql and 02_seed.sql on first startup
      - ./db/init/mysql:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdevops_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ma_devops_network

  # ------------------------------------------------------------------
  # Backend API Service (Node.js & Express)
  # ------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ma-devops-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NODE_ENV: production
      APP_NAME: MA-DevOps-Backend
      APP_VERSION: 1.0.0
      LOG_LEVEL: info
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: devops_password
      DB_NAME: ma_devops_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ma_devops_network

  # ------------------------------------------------------------------
  # Frontend Service (React Static SPA served via Nginx)
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ma-devops-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ma_devops_network

# --------------------------------------------------------------------
# Persistent Storage Volumes
# --------------------------------------------------------------------
volumes:
  mysql_data:
    name: ma_devops_mysql_data

# --------------------------------------------------------------------
# Isolated Bridge Network
# --------------------------------------------------------------------
networks:
  ma_devops_network:
    name: ma_devops_network
    driver: bridge
